# Builds the desktop app for macOS (.dmg) and Windows (.msi and .exe
# installers), and smoke-tests each build on a real Mac and Windows machine
# against a mock of Anthropic's API. Builds are unsigned for now.
#
# Pushes run it through the Release workflow, which then updates the draft
# release; pull requests run it on its own.
name: Desktop app

on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml", ".github/scripts/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every version number matches
        run: python3 .github/scripts/check_versions.py
      - name: Check the app icons are 8-bit RGBA
        # A 16-bit icon makes the macOS app abort at startup.
        run: python3 desktop/scripts/make_icons.py --check desktop/src-tauri/icons
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Run tests
        working-directory: desktop
        run: cargo test --locked

  macos:
    name: macOS build and smoke test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build a universal (Apple silicon + Intel) app and .dmg
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app,dmg
      - name: Smoke test
        run: bash .github/scripts/smoke_macos.sh desktop/target/universal-apple-darwin/release/bundle/macos/Klaudometer.app smoke
      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: klaudometer-macos
          path: desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-macos
          path: smoke/

  windows:
    name: Windows build and smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build the .msi and .exe installers
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles msi,nsis
      - name: Smoke test
        shell: pwsh
        run: |
          $msi = (Get-ChildItem desktop/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName
          ./.github/scripts/smoke_windows.ps1 -Msi $msi -Out smoke
      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: klaudometer-windows
          path: |
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/nsis/*.exe
      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: smoke/
