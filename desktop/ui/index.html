<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klaudometer</title>
  <link rel="stylesheet" href="colors.css">
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <main class="card">
    <header data-tauri-drag-region>
      <span class="name" data-tauri-drag-region>Klaudometer</span>
      <span class="plan" id="plan" hidden></span>
      <button id="refresh" title="Refresh now" aria-label="Refresh now">&#x21bb;</button>
      <button id="close" title="Close" aria-label="Close">&#x2715;</button>
    </header>
    <section class="meters" id="meters" aria-live="polite"></section>
    <footer>
      <span id="footer">Loading…</span>
      <span class="links">
        <a href="#" id="usage-page">Usage page</a>
        <a href="#" id="settings">Settings</a>
      </span>
    </footer>
  </main>
  <script src="card.js"></script>
</body>
</html>
