[package]
name = "klaudometer-core"
description = "Fetches Claude usage and API spend and turns it into meters, pace and alerts"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
ureq = "2"

# The Admin API key lives in the Keychain or Credential Manager. On Linux it
# goes through secret-tool, like the Python helper, so no D-Bus library is needed.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
